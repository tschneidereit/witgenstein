[package]
name = "ts-auto-wit"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 WITH LLVM-exception"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
miette = { version = "7.6", features = ["fancy"] }
oxc_allocator = "0.115"
oxc_ast = "0.115"
oxc_ast_visit = "0.115"
oxc_parser = "0.115"
oxc_resolver = "11.19"
oxc_span = "0.115"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
