[package]
name = "rs-auto-wit"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 WITH LLVM-exception"

[dependencies]
cargo_metadata = "0.23"
clap = { version = "4.5", features = ["derive"] }
miette = { version = "7.6", features = ["fancy"] }
rustdoc-types = "0.57"
semver = "1"
serde_json = "1"
syn = { version = "2", features = ["full", "visit"] }
thiserror = "2"
wit-common = { path = "../wit-common" }
wit-encoder = "0.245"
